[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name            = "timeliner"
version         = "0.1.0"
description     = "Structured timeline generation from news feeds"
authors         = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
readme          = "README.md"

dependencies = [
  "openai>=1.23,<2.0",
  "langchain>=0.2,<0.3",
  "langchain-openai>=0.1.0",
  "langchain-ollama>=0.1.3",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "python-dotenv>=1.0,<2.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
]

[tool.setuptools]
packages = ["timeliner"]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "coverage>=7.4",
    "black>=24.3",
    "ruff>=0.3",
]

[tool.coverage.run]
source = ["timeliner"]

[tool.pytest.ini_options]
addopts = "-q"
