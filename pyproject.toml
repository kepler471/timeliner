[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name            = "timeliner"
version         = "0.1.0"
description     = "Structured timeline generation from news feeds"
authors         = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11"
readme          = "README.md"

dependencies = [
  "openai>=1.76.2,<2.0",
  "langchain>=0.2.17,<0.3",
  "langchain-openai>=0.1.25,<0.2",
  "langchain-ollama>=0.1.3,<0.2",
  "pydantic>=2.11.4,<3.0",
  "pydantic-settings>=2.9.1,<3.0",
  "python-dotenv>=1.1.0,<2.0",
  "pandas>=2.2.3,<3.0",
  "scikit-learn>=1.6.1,<2.0",
]

[tool.setuptools]
packages = ["timeliner"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5,<9.0",
    "coverage>=7.8.0,<8.0",
    "black>=25.1.0,<26.0",
    "ruff>=0.11.8,<0.12",
    "jupyter>=1.1.1,<2.0",
    "mypy>=1.15.0,<2.0",
    "pandas-stubs>=2.2.3.250308,<3.0",
]

[tool.coverage.run]
source = ["timeliner"]

[tool.pytest.ini_options]
addopts = "-q"
